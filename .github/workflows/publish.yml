# Publicação no npm, em duas etapas (staged publishing):
#   1. quando uma release é publicada no GitHub (tag v1.2.3), este workflow
#      confere a versão, roda os testes e envia a versão para a FILA do npm
#      (npm stage publish). Ela ainda não fica pública.
#   2. um mantenedor aprova a versão em npmjs.com → Staged Packages, com 2FA.
#      Só então ela é publicada. Nenhum token do GitHub consegue aprovar: mesmo
#      com o repositório comprometido, nada sai sem o 2FA do mantenedor.
# Depois da aprovação, rode o workflow publish-registry (MCP Registry).
#
# Sem token guardado: o npm confia neste workflow por Trusted Publishing (OIDC),
# configurado no npm como "stage-only", e gera a provenance (a prova de que o
# pacote saiu deste repositório).
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC do Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      # Staged publishing exige npm 11.15.0 ou mais novo.
      - run: npm install -g npm@11

      - name: Confere a versão
        run: |
          versao="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          servidor="$(node -p "require('./server.json').version")"
          if [ "$tag" != "$versao" ] || [ "$servidor" != "$versao" ]; then
            echo "Tag ($tag), package.json ($versao) e server.json ($servidor) precisam ter a mesma versão"
            exit 1
          fi
          echo "VERSAO=$versao" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:pack

      - name: Envia para a fila do npm
        run: npm stage publish --access public

      - name: Próximos passos
        run: |
          {
            echo "## study-notes-mcp@$VERSAO está na fila do npm"
            echo
            echo "1. Aprove em https://www.npmjs.com/package/study-notes-mcp → **Staged Packages** → **Approve** (pede o 2FA)."
            echo "2. Depois, rode o workflow **publish-registry** (Actions → publish-registry → Run workflow) para atualizar o MCP Registry."
          } >> "$GITHUB_STEP_SUMMARY"
