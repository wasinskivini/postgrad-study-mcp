# Publica os metadados (server.json) no MCP Registry.
# Rode à mão (Actions → publish-registry → Run workflow) DEPOIS de aprovar a
# versão no npm: o Registry confere se a versão do server.json já existe no
# npm e recusa se ela ainda estiver na fila do staged publishing.
name: publish-registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC do MCP Registry
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7

      - name: Confere se a versão já foi aprovada no npm
        run: |
          versao="$(node -p "require('./server.json').version")"
          if ! npm view "study-notes-mcp@$versao" version > /dev/null 2>&1; then
            echo "study-notes-mcp@$versao ainda não está público no npm."
            echo "Aprove a versão em npmjs.com → Staged Packages e rode este workflow de novo."
            exit 1
          fi

      # mcp-publisher numa versão fixa e com a assinatura conferida (Sigstore),
      # como recomenda a documentação do MCP Registry.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Baixa e confere o mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publica no MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
