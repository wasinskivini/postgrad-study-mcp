name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # O pacote do npm: compila para dist/, roda todos os testes contra o
  # JavaScript compilado e instala o .tgz numa pasta vazia (tests/pacote.smoke.ts).
  pacote:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TEST_DIST: 1
      - run: npm run test:pack

  # Busca semântica com o modelo de verdade (PASSO 6). Fica num job separado
  # porque baixa ~145 MB; o cache guarda o modelo entre as execuções.
  semantic:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .modelos
          key: modelo-multilingual-e5-small-761b726d-${{ runner.os }}
      - run: npm ci
      - run: npm run test:semantic
        env:
          MODELS_DIR: ${{ github.workspace }}/.modelos
